<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">Illustrative defect register</title><desc id="d">A sample schedule of defects, owners, target dates and status.</desc><rect width="900" height="620" rx="28" fill="#eef2f4"/><rect x="38" y="34" width="824" height="550" rx="18" fill="#fff" stroke="#d7e0e6"/><rect x="38" y="34" width="824" height="84" rx="18" fill="#08233d"/><rect x="38" y="98" width="824" height="20" fill="#08233d"/><text x="72" y="76" font-family="Arial" font-size="24" font-weight="700" fill="#fff">DEFECT &amp; ACTION REGISTER</text><text x="72" y="100" font-family="Arial" font-size="11" fill="#d8e3ea">ILLUSTRATIVE COORDINATION SCHEDULE</text><g font-family="Arial"><rect x="72" y="144" width="756" height="42" rx="6" fill="#e9eff3"/><g font-size="11" font-weight="700" fill="#31414c"><text x="86" y="170">REF</text><text x="147" y="170">LOCATION / ITEM</text><text x="450" y="170">PRIORITY</text><text x="555" y="170">OWNER</text><text x="678" y="170">STATUS</text></g><g font-size="12" fill="#53616b"><line x1="72" y1="230" x2="828" y2="230" stroke="#e1e7eb"/><text x="86" y="216">D-01</text><text x="147" y="207" font-weight="700" fill="#162634">Roof edge / damaged flashing</text><text x="147" y="223">Repair and confirm watertight finish</text><rect x="450" y="197" width="79" height="26" rx="13" fill="#ffe6e1"/><text x="490" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#9f3225">URGENT</text><text x="555" y="216">Contractor</text><text x="678" y="216" font-weight="700" fill="#9f3225">OPEN</text><line x1="72" y1="294" x2="828" y2="294" stroke="#e1e7eb"/><text x="86" y="280">D-02</text><text x="147" y="271" font-weight="700" fill="#162634">Bathroom / sealant gaps</text><text x="147" y="287">Remove and replace defective sealant</text><rect x="450" y="261" width="79" height="26" rx="13" fill="#fff0c8"/><text x="490" y="279" text-anchor="middle" font-size="10" font-weight="700" fill="#8b6100">ACTION</text><text x="555" y="280">Artisan</text><text x="678" y="280" font-weight="700" fill="#8b6100">IN REVIEW</text><line x1="72" y1="358" x2="828" y2="358" stroke="#e1e7eb"/><text x="86" y="344">D-03</text><text x="147" y="335" font-weight="700" fill="#162634">External wall / hairline crack</text><text x="147" y="351">Record and observe over two visits</text><rect x="450" y="325" width="79" height="26" rx="13" fill="#e9f5ee"/><text x="490" y="343" text-anchor="middle" font-size="10" font-weight="700" fill="#246b49">MONITOR</text><text x="555" y="344">TAJ</text><text x="678" y="344" font-weight="700" fill="#246b49">TRACKING</text><line x1="72" y1="422" x2="828" y2="422" stroke="#e1e7eb"/><text x="86" y="408">D-04</text><text x="147" y="399" font-weight="700" fill="#162634">Door / misaligned ironmongery</text><text x="147" y="415">Adjust and test operation</text><rect x="450" y="389" width="79" height="26" rx="13" fill="#fff0c8"/><text x="490" y="407" text-anchor="middle" font-size="10" font-weight="700" fill="#8b6100">ACTION</text><text x="555" y="408">Contractor</text><text x="678" y="408" font-weight="700" fill="#246b49">CLOSED</text></g><rect x="72" y="468" width="756" height="70" rx="10" fill="#f7fafb" stroke="#e0e7eb"/><text x="92" y="495" font-size="12" font-weight="700" fill="#08233d">CONTROL NOTE</text><text x="92" y="518" font-size="12" fill="#5d6b75">Each action should have an agreed owner, target date and close-out evidence.</text><text x="72" y="563" font-size="11" fill="#7b8790">Illustrative register only. Responsibility remains subject to contract and agreed scope.</text></g></svg>