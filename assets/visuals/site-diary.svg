<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">Illustrative site diary</title><desc id="d">A sample daily site record showing labour, weather, activities and instructions.</desc><rect width="900" height="620" rx="28" fill="#eef2f4"/><rect x="50" y="30" width="800" height="560" rx="20" fill="#fff" stroke="#d7e0e6"/><rect x="50" y="30" width="800" height="82" rx="20" fill="#08233d"/><rect x="50" y="92" width="800" height="20" fill="#08233d"/><text x="82" y="72" font-family="Arial" font-size="24" font-weight="700" fill="#fff">DAILY SITE RECORD</text><text x="82" y="97" font-family="Arial" font-size="11" fill="#d8e3ea">ILLUSTRATIVE DOCUMENTATION FORMAT</text><g font-family="Arial"><rect x="82" y="140" width="218" height="85" rx="12" fill="#f7fafb" stroke="#dfe7eb"/><text x="102" y="169" font-size="11" font-weight="700" fill="#66737c">DATE / VISIT</text><text x="102" y="202" font-size="18" font-weight="700" fill="#08233d">14 JUL · VISIT 06</text><rect x="320" y="140" width="218" height="85" rx="12" fill="#f7fafb" stroke="#dfe7eb"/><text x="340" y="169" font-size="11" font-weight="700" fill="#66737c">WEATHER</text><text x="340" y="202" font-size="18" font-weight="700" fill="#08233d">Dry · 29°C</text><rect x="558" y="140" width="260" height="85" rx="12" fill="#f7fafb" stroke="#dfe7eb"/><text x="578" y="169" font-size="11" font-weight="700" fill="#66737c">PERSONNEL OBSERVED</text><text x="578" y="202" font-size="18" font-weight="700" fill="#08233d">18 workers</text><text x="82" y="266" font-size="13" font-weight="700" fill="#08233d">ACTIVITIES OBSERVED</text><rect x="82" y="284" width="736" height="88" rx="12" fill="#f8fafb" stroke="#e0e7eb"/><text x="104" y="315" font-size="13" fill="#53616b">• Blockwork progressed on first-floor north elevation.</text><text x="104" y="342" font-size="13" fill="#53616b">• Electrical conduits installed in living-area walls.</text><text x="82" y="409" font-size="13" font-weight="700" fill="#08233d">INSTRUCTIONS / OPEN ITEMS</text><rect x="82" y="427" width="354" height="92" rx="12" fill="#fff8e8" stroke="#ead6a5"/><text x="104" y="458" font-size="12" font-weight="700" fill="#835b00">ACTION 01</text><text x="104" y="483" font-size="12" fill="#5d6b75">Confirm lintel reinforcement detail before casting.</text><rect x="464" y="427" width="354" height="92" rx="12" fill="#eef7f2" stroke="#c7dfd2"/><text x="486" y="458" font-size="12" font-weight="700" fill="#246b49">CLOSED ITEM</text><text x="486" y="483" font-size="12" fill="#5d6b75">Material delivery record received and filed.</text><text x="82" y="560" font-size="11" fill="#7b8790">Illustrative record. A site diary documents events; it does not replace contractual instructions.</text></g></svg>