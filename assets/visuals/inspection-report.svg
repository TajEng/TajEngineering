<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">Illustrative building condition report</title><desc id="d">A sample report layout showing findings, priorities and next actions.</desc><rect width="900" height="620" rx="28" fill="#eef2f4"/><rect x="42" y="34" width="816" height="552" rx="18" fill="#fff" stroke="#d7e0e6"/><rect x="42" y="34" width="816" height="84" rx="18" fill="#08233d"/><rect x="42" y="98" width="816" height="20" fill="#08233d"/><text x="78" y="76" font-family="Arial" font-size="25" font-weight="700" fill="#fff">BUILDING CONDITION REPORT</text><text x="78" y="101" font-family="Arial" font-size="12" fill="#d8e3ea">ILLUSTRATIVE OUTPUT · PROJECT SUMMARY</text><rect x="78" y="148" width="286" height="176" rx="12" fill="#e7edf1"/><path d="M102 292L168 214l47 45 55-82 71 115z" fill="#c4d1d9"/><circle cx="302" cy="183" r="18" fill="#dca125"/><text x="394" y="164" font-family="Arial" font-size="13" font-weight="700" fill="#09253f">OBSERVATION 01</text><text x="394" y="191" font-family="Arial" font-size="23" font-weight="700" fill="#162634">Moisture staining</text><text x="394" y="221" font-family="Arial" font-size="14" fill="#5d6b75">Visible staining noted below the window opening.</text><rect x="394" y="244" width="106" height="30" rx="15" fill="#fce9c0"/><text x="447" y="264" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#8a5c00">ACTION SOON</text><text x="394" y="302" font-family="Arial" font-size="13" font-weight="700" fill="#09253f">NEXT STEP</text><text x="394" y="326" font-family="Arial" font-size="14" fill="#5d6b75">Check external sealant and monitor after rainfall.</text><line x1="78" y1="360" x2="822" y2="360" stroke="#dce4e9"/><text x="78" y="401" font-family="Arial" font-size="14" font-weight="700" fill="#09253f">PRIORITY SUMMARY</text><g font-family="Arial" font-size="13"><rect x="78" y="425" width="218" height="88" rx="10" fill="#fff4f2" stroke="#f0c6bf"/><circle cx="108" cy="454" r="9" fill="#c94332"/><text x="130" y="459" font-weight="700" fill="#7d2a20">URGENT</text><text x="108" y="488" fill="#5d6b75">1 item</text><rect x="319" y="425" width="218" height="88" rx="10" fill="#fff9ec" stroke="#efdba7"/><circle cx="349" cy="454" r="9" fill="#dca125"/><text x="371" y="459" font-weight="700" fill="#805800">ACTION SOON</text><text x="349" y="488" fill="#5d6b75">4 items</text><rect x="560" y="425" width="262" height="88" rx="10" fill="#eef7f2" stroke="#c6dfd1"/><circle cx="590" cy="454" r="9" fill="#297a51"/><text x="612" y="459" font-weight="700" fill="#1e5c3d">MONITOR</text><text x="590" y="488" fill="#5d6b75">6 items</text></g><text x="78" y="554" font-family="Arial" font-size="11" fill="#7b8790">Sample layout only. Findings and recommendations depend on the agreed inspection scope.</text></svg>