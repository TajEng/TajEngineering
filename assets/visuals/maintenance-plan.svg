<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">Illustrative maintenance plan</title><desc id="d">A sample maintenance schedule showing actions, frequencies and priorities.</desc><rect width="900" height="620" rx="28" fill="#eef2f4"/><rect x="40" y="34" width="820" height="552" rx="18" fill="#fff" stroke="#d7e0e6"/><rect x="40" y="34" width="820" height="84" rx="18" fill="#08233d"/><rect x="40" y="98" width="820" height="20" fill="#08233d"/><text x="74" y="76" font-family="Arial" font-size="24" font-weight="700" fill="#fff">PROPERTY MAINTENANCE PLAN</text><text x="74" y="100" font-family="Arial" font-size="11" fill="#d8e3ea">ILLUSTRATIVE PRIORITY &amp; FREQUENCY SCHEDULE</text><g font-family="Arial"><text x="74" y="153" font-size="13" font-weight="700" fill="#08233d">90-DAY ACTION PLAN</text><g><rect x="74" y="176" width="235" height="126" rx="14" fill="#fff1ee" stroke="#efc7bf"/><text x="96" y="209" font-size="12" font-weight="700" fill="#9f3225">0–14 DAYS</text><text x="96" y="242" font-size="15" font-weight="700" fill="#162634">Stop active water entry</text><text x="96" y="270" font-size="12" fill="#5d6b75">Roof edge and external sealant</text><rect x="332" y="176" width="235" height="126" rx="14" fill="#fff8e7" stroke="#ead7a5"/><text x="354" y="209" font-size="12" font-weight="700" fill="#835b00">15–45 DAYS</text><text x="354" y="242" font-size="15" font-weight="700" fill="#162634">Close repair actions</text><text x="354" y="270" font-size="12" fill="#5d6b75">Joinery, sealant and finishes</text><rect x="590" y="176" width="236" height="126" rx="14" fill="#eef7f2" stroke="#c7dfd2"/><text x="612" y="209" font-size="12" font-weight="700" fill="#246b49">46–90 DAYS</text><text x="612" y="242" font-size="15" font-weight="700" fill="#162634">Verify and monitor</text><text x="612" y="270" font-size="12" fill="#5d6b75">Close-out evidence and recheck</text></g><text x="74" y="345" font-size="13" font-weight="700" fill="#08233d">PLANNED MAINTENANCE REGISTER</text><rect x="74" y="365" width="752" height="40" rx="6" fill="#e9eff3"/><g font-size="11" font-weight="700" fill="#31414c"><text x="90" y="390">ITEM</text><text x="390" y="390">FREQUENCY</text><text x="545" y="390">RESPONSIBILITY</text><text x="710" y="390">STATUS</text></g><g font-size="12" fill="#53616b"><text x="90" y="438">Roof drainage and outlets</text><text x="390" y="438">Quarterly</text><text x="545" y="438">Approved artisan</text><text x="710" y="438" font-weight="700" fill="#835b00">PLANNED</text><line x1="74" y1="455" x2="826" y2="455" stroke="#e1e7eb"/><text x="90" y="486">External sealant inspection</text><text x="390" y="486">Six-monthly</text><text x="545" y="486">Maintenance team</text><text x="710" y="486" font-weight="700" fill="#246b49">CURRENT</text><line x1="74" y1="503" x2="826" y2="503" stroke="#e1e7eb"/><text x="90" y="534">Electrical visual check</text><text x="390" y="534">Annually</text><text x="545" y="534">Qualified specialist</text><text x="710" y="534" font-weight="700" fill="#697680">DUE LATER</text></g><text x="74" y="566" font-size="11" fill="#7b8790">Illustrative plan. Actual frequencies depend on condition, use and specialist advice.</text></g></svg>